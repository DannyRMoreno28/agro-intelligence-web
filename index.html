<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card p-5 shadow border-0 text-center" style="max-width: 450px; width: 100%;">
        <h3 class="text-success fw-bold mb-2">AGRO INTELLIGENCE</h3>
        <p class="text-muted small mb-4">Centralice sus datos y optimice la toma de decisiones en su producción.</p>
        
        <form>
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small">Ingrese su usuario</label>
                <input type="email" class="form-control form-control-lg" placeholder="ejemplo@correo.com">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-secondary small">Ingrese su contraseña</label>
                <input type="password" class="form-control form-control-lg" placeholder="••••••••">
            </div>
            
            <a href="dashboard.html" class="btn btn-success btn-lg w-100 mb-3">Iniciar Sesión</a>
            <a href="#" class="text-decoration-none small text-muted d-block">¿Olvidó su contraseña?</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
