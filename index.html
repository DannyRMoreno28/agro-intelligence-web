<!DOCTYPE html>
<!-- Indica que el documento está hecho en HTML5 -->

<html lang="es">
<head>
    <meta charset="UTF-8">    <!-- Permite mostrar caracteres especiales y tildes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Hace que la página se adapte a diferentes tamaños de pantalla -->
    <title>Agro Intelligence - Login</title>   <!-- Nombre que aparece en la pestaña del navegador -->
    <!-- Librería de Bootstrap para darle estilo a la página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- 
bg-light = fondo claro
d-flex = activa flexbox
align-items-center = centra verticalmente
justify-content-center = centra horizontalmente
vh-100 = ocupa toda la altura de la pantalla
-->
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <!-- Tarjeta principal del login -->
    <div class="card p-5 shadow border-0 text-center" style="max-width: 450px; width: 100%;">
        <!-- Título principal -->
        <h3 class="text-success fw-bold mb-2">AGRO INTELLIGENCE</h3>
        <!-- Texto descriptivo -->
        <p class="text-muted small mb-4">
            Centralice sus datos y optimice la toma de decisiones en su producción.
        </p>

        
        <form> <!-- Formulario de inicio de sesión -->
            <div class="mb-3 text-start"> <!-- Campo para ingresar el usuario -->
                <label class="form-label text-secondary small">
                    Ingrese su usuario
                </label>
                <!-- Input para escribir el correo -->
                <input type="email"
                class="form-control form-control-lg"
                placeholder="ejemplo@correo.com">
            </div>

            <!-- Campo para la contraseña -->
            <div class="mb-4 text-start">
                <label class="form-label text-secondary small">
                    Ingrese su contraseña
                </label>
                <!-- Input tipo contraseña -->
                <input type="password"
                class="form-control form-control-lg"
                placeholder="••••••••">
            </div>
            
            <!-- Botón para ingresar al sistema -->
            <a href="dashboard.html"
            class="btn btn-success btn-lg w-100 mb-3">
                Iniciar Sesión
            </a>

            <!-- Enlace para recuperar contraseña -->
            <a href="#"
            class="text-decoration-none small text-muted d-block">
                ¿Olvidó su contraseña?
            </a>
        </form>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
